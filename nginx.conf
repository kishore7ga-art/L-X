server {
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The apex is the public landing site, so it is crawled. gzip is on for the
    # text assets; the JPEG frame sequence in /sequence is already compressed and
    # re-compressing it only costs CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints every file in /assets, so the content at a given URL
    # never changes and a year is safe. Anything else is served by name and must
    # not be pinned.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # The scroll animation's 300 frames, requested in a burst. Named rather than
    # fingerprinted, so this is a revalidating cache and not an immutable one.
    location ^~ /sequence/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
