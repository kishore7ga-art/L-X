<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bower — Beautiful Websites for Institutions</title>
  
  <!-- Google Fonts: Outfit, Plus Jakarta Sans, Wix Madefor Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:wght@400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    // Set the theme before first paint so there is no light flash on a dark reload.
    (function () {
      try {
        var stored = localStorage.getItem('webxite-theme');
        var dark = stored === 'dark' ||
          ((!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body class="overflow-x-hidden antialiased selection:bg-slate-200 selection:text-black dark:selection:bg-blue-500/30 dark:selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
