<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXite — Websites for Institutions, Built in an Afternoon</title>
  <meta name="description" content="WebXite is a website builder for colleges and institutions. Build, publish and connect your own domain — no developers, no hosting to manage." />
  <meta name="theme-color" content="#1E3A5F" />

  <!-- Open Graph / social preview. Absent entirely before, so a shared link
       rendered as a bare URL with no title, image or description. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WebXite" />
  <meta property="og:title" content="WebXite — Websites for Institutions" />
  <meta property="og:description" content="Build, publish and connect your own domain. No developers, no hosting to manage." />
  <meta property="og:url" content="https://webxite.org/" />
  <meta name="twitter:card" content="summary_large_image" />
  
  <!-- Google Fonts: Outfit, Plus Jakarta Sans, Wix Madefor Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:wght@400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    // Set the theme before first paint so there is no light flash on a dark reload.
    (function () {
      try {
        var stored = localStorage.getItem('webxite-theme');
        var dark = stored === 'dark' ||
          ((!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body class="overflow-x-hidden antialiased selection:bg-slate-200 selection:text-black dark:selection:bg-blue-500/30 dark:selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
